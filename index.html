        && request.resource.data.items.size() <= 100
        && request.resource.data.total is number
        && request.resource.data.total >= 0
        && str(request.resource.data.customer.name, 1, 80)
        && str(request.resource.data.customer.phone, 10, 20)
        && request.resource.data.payment.method in ['cod','store','upi','razorpay']
        && (request.resource.data.payment.status in ['pending','verifying']
            || (request.resource.data.payment.method == 'razorpay'
                && request.resource.data.payment.status == 'paid'));
      allow update: if isAdmin()
        || (resource.data.status == 'placed'
            && request.resource.data.status == 'cancelled'
            && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['status','history','updatedAt']));
      allow delete: if isAdmin();
    }

    // Contact messages: anyone sends, only admins read.
    match /messages/{id} {
      allow create: if str(request.resource.data.name, 1, 80)
        && str(request.resource.data.phone, 10, 20)
        && str(request.resource.data.text, 1, 2000)
        && request.resource.data.read == false;
      allow read, update, delete: if isAdmin();
    }
  }
}
